---
name: Release

# Publishes to npm and JSR using OIDC trusted publishing — no NPM_TOKEN or
# JSR token needs to be configured. Trusted publishers must be registered
# once at:
#   https://www.npmjs.com/package/@nvl/tag-to-code-lang/access  (npm)
#   https://jsr.io/@nvl/tag-to-code-lang/settings               (JSR)
# pointing at this repository + this workflow file.

on:
  push:
    branches:
      - main
  # Dispatched by update.yml after the weekly cron pushes a version bump:
  # a GITHUB_TOKEN push doesn't trigger `push` workflows, but it can trigger
  # workflow_dispatch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest

    # The npm trusted publisher entry is registered with this environment;
    # the OIDC token must carry the matching `environment` claim or npm
    # rejects the publish with 404 on the token exchange.
    environment: release

    permissions:
      contents: write # changesets/action commits version bumps / tags
      pull-requests: write # changesets/action opens the "Version Packages" PR
      id-token: write # OIDC token for npm + JSR trusted publishing

    steps:
      # changesets/action needs persisted creds for git history reads;
      # we don't upload artifacts.
      - name: Checkout # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so changesets can write the changelog and tag.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage/
        continue-on-error: true

      # When the push to main brings new changesets, this opens (or updates) a
      # "Version Packages" PR. When that PR is merged, this same workflow runs
      # again — this time with no pending changesets but with version bumps in
      # place — and the action runs `publish` instead.
      #
      # `commitMode: github-api` makes the action push commits and tags through
      # the GitHub API instead of `git push`, so everything is GPG-signed by
      # GitHub and attributed to github-actions[bot] (Verified). Added in
      # changesets/action v1.5.0.
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm ci:version
          publish: pnpm ci:publish
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
