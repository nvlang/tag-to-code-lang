---
name: Zizmor

# Static-analyses the workflow files for security issues (missing pins,
# unsafe expressions, excessive permissions, etc.). Runs on every PR
# that touches the workflows, on push to main, and weekly as a backstop.
# Findings show up under Security → Code scanning.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # upload SARIF
  actions: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
