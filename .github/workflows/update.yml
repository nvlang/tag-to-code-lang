---
name: Sync upstream

# Weekly cron that pulls the latest `languages.yml` from github-linguist
# and, if there are any changes, writes a patch changeset, applies the
# version bump, and pushes the result to main. The push triggers
# release.yml, which is the single workflow registered as a trusted
# publisher on npm — it handles the actual publish to npm and JSR.
#
# Note: the bot's commit is pushed with plain git and so is unverified in
# the GitHub UI. Don't enable "Require signed commits" on main without
# replacing this push step with an API-based commit (or a GitHub App
# token).

on:
  schedule:
    - cron: '0 0 * * 0' # Sundays at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync linguist data
    runs-on: ubuntu-latest

    permissions:
      contents: write # push the version bump back to main + develop

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch linguist data
        run: pnpm exec tsx scripts/fetch-data.ts

      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain src)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes — exiting."
          fi

      - name: Generate changeset
        if: steps.changes.outputs.changed == 'true'
        run: |
          cat > .changeset/auto-sync-linguist.md << 'EOF'
          ---
          '@nvl/tag-to-code-lang': patch
          ---

          Sync with upstream [`github-linguist/linguist`](https://github.com/github-linguist/linguist) data.
          EOF

      - name: Apply version bump
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm ci:version

      # Fail-fast: don't push a broken commit to main.
      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: pnpm build

      - name: Test
        if: steps.changes.outputs.changed == 'true'
        run: pnpm test

      # Pushing to main (without `[skip ci]`) triggers release.yml, which
      # detects the version-bumped state and runs `pnpm ci:publish` from
      # its trusted-publisher environment.
      - name: Commit and push to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: sync linguist data"
          git push origin main

      # Keep develop from drifting behind main on auto-generated data.
      # Fast-forwards if possible; otherwise creates a merge commit.
      - name: Sync develop with main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git fetch origin develop
          git checkout -B develop origin/develop
          git merge origin/main -m "chore: sync linguist data from main [skip ci]"
          git push origin develop
