---
name: Sync upstream

# Weekly cron that pulls the latest `languages.yml` from github-linguist
# and, if there are any changes, writes a patch changeset, applies the
# version bump, and pushes the result to main. It then dispatches
# release.yml (the single workflow registered as an npm trusted publisher),
# which handles the actual publish to npm and JSR — a plain GITHUB_TOKEN
# push wouldn't trigger release.yml's `push` event on its own.
#
# Note: the bot's commit is pushed with plain git and so is unverified in
# the GitHub UI. Don't enable "Require signed commits" on main without
# replacing this push step with an API-based commit (or a GitHub App
# token).

on:
  schedule:
    - cron: '0 0 * * 0' # Sundays at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync linguist data
    runs-on: ubuntu-latest

    permissions:
      contents: write # push the version bump back to main + develop
      actions: write # dispatch release.yml after pushing to main

    steps:
      - name: Checkout main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch linguist data
        run: pnpm exec tsx scripts/fetch-data.ts

      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain src)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes — exiting."
          fi

      - name: Generate changeset
        if: steps.changes.outputs.changed == 'true'
        run: |
          cat > .changeset/auto-sync-linguist.md << 'EOF'
          ---
          '@nvl/tag-to-code-lang': patch
          ---

          Sync with upstream [`github-linguist/linguist`](https://github.com/github-linguist/linguist) data.
          EOF

      - name: Apply version bump
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm ci:version

      # Fail-fast: don't push a broken commit to main.
      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: pnpm build

      - name: Test
        if: steps.changes.outputs.changed == 'true'
        run: pnpm test

      # Pushing to main (without `[skip ci]`) triggers release.yml, which
      # detects the version-bumped state and runs `pnpm ci:publish` from
      # its trusted-publisher environment.
      - name: Commit and push to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: sync linguist data"
          git push origin main

      # A GITHUB_TOKEN push doesn't trigger release.yml's `push` event, so
      # kick it off explicitly. release.yml sees the version-bumped state
      # (no pending changesets) and publishes from its trusted-publisher env.
      - name: Trigger release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref main

      # The GITHUB_TOKEN push above also won't trigger sync-develop.yml, so
      # fast-forward develop here. FF-only (no merge commit) so nothing ends
      # up unsigned; if develop has diverged, warn instead.
      - name: Fast-forward develop to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git fetch origin main
          if ! git ls-remote --exit-code --heads origin develop >/dev/null 2>&1; then
            echo "::warning::No develop branch; skipping sync."
            exit 0
          fi
          git fetch origin develop
          if git merge-base --is-ancestor origin/develop origin/main; then
            git push origin "origin/main:refs/heads/develop"
          else
            echo "::warning::develop has commits not on main; fast-forward not possible. Back-merge manually (signed)."
          fi
