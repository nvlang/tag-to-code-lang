# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'develop'
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps-dev)'
    schedule:
      interval: 'monthly'
      time: '09:00'
      timezone: 'Europe/Paris'
    # Wait a bit after a release before opening a PR so post-release
    # regressions surface elsewhere first.
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Collapse N updates into 2 PRs: one for patch+minor (auto-merged
    # by dependabot-auto-merge.yml), one for majors (needs review).
    groups:
      patch-and-minor:
        update-types:
          - 'minor'
          - 'patch'
      majors:
        update-types:
          - 'major'

  - package-ecosystem: 'github-actions'
    # Must be "/" — github-actions ecosystem looks for workflow files in
    # .github/workflows relative to this directory.
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'monthly'
      time: '09:00'
      timezone: 'Europe/Paris'
    # github-actions has no semver-* cooldown keys (tags aren't semver).
    cooldown:
      default-days: 7
    groups:
      patch-and-minor:
        update-types:
          - 'minor'
          - 'patch'
      majors:
        update-types:
          - 'major'
